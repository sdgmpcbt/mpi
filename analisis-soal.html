  display: table;
}

.grid{
  display: grid;
}

.hidden{
  display: none;
}

.border{
  border-width: 1px;
}

.italic{
  font-style: italic;
}

.ring{
  --tw-ring-offset-shadow: var(--tw-ring-inset) 0 0 0 var(--tw-ring-offset-width) var(--tw-ring-offset-color);
  --tw-ring-shadow: var(--tw-ring-inset) 0 0 0 calc(3px + var(--tw-ring-offset-width)) var(--tw-ring-color);
  box-shadow: var(--tw-ring-offset-shadow), var(--tw-ring-shadow), var(--tw-shadow, 0 0 #0000);
}

.filter{
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

:root{
  --navy:#1E3A5F;
  --navy2:#12263F;
  --amber:#F59E0B;
  --teal:#0E9F8A;
  --surface:#FFFFFF;
  --bg:#F2F5F8;
  --muted:#EEF2F6;
  --text:#17263A;
  --text2:#5B6B7E;
  --line:#DCE5EE;
  --ok:#0E9F8A;
  --warn:#F59E0B;
  --bad:#DC4A4A;
}

@media (prefers-color-scheme: dark){
  :root{
    --surface:#16293F;
    --bg:#0E1E31;
    --muted:#1E354D;
    --text:#F2F6FA;
    --text2:#B7C5D3;
    --line:#2B445E;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,sans-serif
}

button,input,select,textarea{
  font:inherit
}

.serif{
  font-family:"Times New Roman",Times,serif
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:0 8px 24px rgba(18,38,63,.06)
}

.chip{
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:999px;
  padding:9px 14px;
  font-weight:700;
  cursor:pointer
}

.chip.active{
  background:var(--navy);
  color:white;
  border-color:var(--navy)
}

.field{
  width:100%;
  border:1px solid var(--line);
  border-radius:12px;
  padding:11px 12px;
  background:var(--surface);
  color:var(--text);
  outline:none
}

.field:focus{
  border-color:var(--teal);
  box-shadow:0 0 0 3px rgba(14,159,138,.15)
}

.label{
  font-size:12px;
  font-weight:800;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--text2);
  margin-bottom:6px;
  display:block
}

.btn-primary{
  background:var(--navy);
  color:white;
  border-radius:12px;
  padding:12px 16px;
  font-weight:800;
  border:0;
  cursor:pointer
}

.btn-amber{
  background:var(--amber);
  color:#1E2A00;
  border-radius:12px;
  padding:12px 16px;
  font-weight:800;
  border:0;
  cursor:pointer
}

.btn-ghost{
  background:var(--muted);
  color:var(--text);
  border-radius:12px;
  padding:11px 14px;
  font-weight:700;
  border:1px solid var(--line);
  cursor:pointer
}

button:disabled{
  opacity:.55;
  cursor:not-allowed
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  border-radius:999px;
  padding:5px 9px;
  font-size:12px;
  font-weight:800
}

.badge-ok{
  background:#DDF5EF;
  color:#06785F
}

.badge-warn{
  background:#FFF1D2;
  color:#8A5600
}

.badge-bad{
  background:#FFE3E3;
  color:#9B2222
}

table{
  width:100%;
  border-collapse:collapse
}

th{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.04em;
  color:var(--text2);
  text-align:left;
  padding:10px;
  border-bottom:1px solid var(--line)
}

td{
  padding:11px 10px;
  border-bottom:1px solid var(--line);
  vertical-align:top
}

.progress-ring{
  transform:rotate(-90deg)
}

@media print{
  .no-print{
    display:none!important
  }
}
