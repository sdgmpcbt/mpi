وا لَيَصْرِمُنَّهَا مُصْبِحِينَ|وَلَا يَسْتَثْنُونَ|فَطَافَ عَلَيْهَا طَائِفٌ مِّن رَّبِّكَ وَهُمْ نَائِمُونَ|فَأَصْبَحَتْ كَالصَّرِيمِ|فَتَنَادَوْا مُصْبِحِينَ|أَنِ اغْدُوا عَلَىٰ حَرْثِكُمْ إِن كُنتُمْ صَارِمِينَ|فَانطَلَقُوا وَهُمْ يَتَخَافَتُونَ|أَن لَّا يَدْخُلَنَّهَا الْيَوْمَ عَلَيْكُم مِّسْكِينٌ|وَغَدَوْا عَلَىٰ حَرْدٍ قَادِرِينَ|فَلَمَّا رَأَوْهَا قَالُوا إِنَّا لَضَالُّونَ|بَلْ نَحْنُ مَحْرُومُونَ|قَالَ أَوْسَطُهُمْ أَلَمْ أَقُل لَّكُمْ لَوْلَا تُسَبِّحُونَ|قَالُوا سُبْحَانَ رَبِّنَا إِنَّا كُنَّا ظَالِمِينَ|فَأَقْبَلَ بَعْضُهُمْ عَلَىٰ بَعْضٍ يَتَلَاوَمُونَ|قَالُوا يَا وَيْلَنَا إِنَّا كُنَّا طَاغِينَ|عَسَىٰ رَبُّنَا أَن يُبْدِلَنَا خَيْرًا مِّنْهَا إِنَّا إِلَىٰ رَبِّنَا رَاغِبُونَ|كَذَٰلِكَ الْعَذَابُ ۖ وَلَعَذَابُ الْآخِرَةِ أَكْبَرُ ۚ لَوْ كَانُوا يَعْلَمُونَ|إِنَّ لِلْمُتَّقِينَ عِندَ رَبِّهِمْ جَنَّاتِ النَّعِيمِ|أَفَنَجْعَلُ الْمُسْلِمِينَ كَالْمُجْرِمِينَ|مَا لَكُمْ كَيْفَ تَحْكُمُونَ|أَمْ لَكُمْ كِتَابٌ فِيهِ تَدْرُسُونَ|إِنَّ لَكُمْ فِيهِ لَمَا تَخَيَّرُونَ|أَمْ لَكُمْ أَيْمَانٌ عَلَيْنَا بَالِغَةٌ إِلَىٰ يَوْمِ الْقِيَامَةِ ۙ إِنَّ لَكُمْ لَمَا تَحْكُمُونَ|سَلْهُمْ أَيُّهُم بِذَٰلِكَ زَعِيمٌ|أَمْ لَهُمْ شُرَكَاءُ فَلْيَأْتُوا بِشُرَكَائِهِمْ إِن كَانُوا صَادِقِينَ|يَوْمَ يُكْشَفُ عَن سَاقٍ وَيُدْعَوْنَ إِلَى السُّجُودِ فَلَا يَسْتَطِيعُونَ|خَاشِعَةً أَبْصَارُهُمْ تَرْهَقُهُمْ ذِلَّةٌ ۖ وَقَدْ كَانُوا يُدْعَوْنَ إِلَى السُّجُودِ وَهُمْ سَالِمُونَ|فَذَرْنِي وَمَن يُكَذِّبُ بِهَٰذَا الْحَدِيثِ ۖ سَنَسْتَدْرِجُهُم مِّنْ حَيْثُ لَا يَعْلَمُونَ|وَأُمْلِي لَهُمْ ۚ إِنَّ كَيْدِي مَتِينٌ|أَمْ تَسْأَلُهُمْ أَجْرًا فَهُم مِّن مَّغْرَمٍ مُّثْقَلُونَ|أَمْ عِندَهُمُ الْغَيْبُ فَهُمْ يَكْتُبُونَ|فَاصْبِرْ لِحُكْمِ رَبِّكَ وَلَا تَكُن كَصَاحِبِ الْحُوتِ إِذْ نَادَىٰ وَهُوَ مَكْظُومٌ|لَّوْلَا أَن تَدَارَكَهُ نِعْمَةٌ مِّن رَّبِّهِ لَنُبِذَ بِالْعَرَاءِ وَهُوَ مَذْمُومٌ|فَاجْتَبَاهُ رَبُّهُ فَجَعَلَهُ مِنَ الصَّالِحِينَ|وَإِن يَكَادُ الَّذِينَ كَفَرُوا لَيُزْلِقُونَكَ بِأَبْصَارِهِمْ لَمَّا سَمِعُوا الذِّكْرَ وَيَقُولُونَ إِنَّهُ لَمَجْنُونٌ|وَمَا هُوَ إِلَّا ذِكْرٌ لِّلْعَالَمِينَ"),T(69,"الحاقة","Al-Haqqah","الْحَاقَّةُ|مَا الْحَاقَّةُ|وَمَا أَدْرَاكَ مَا الْحَاقَّةُ|كَذَّبَتْ ثَمُودُ وَعَادٌ بِالْقَارِعَةِ|فَأَمَّا ثَمُودُ فَأُهْلِكُوا بِالطَّاغِيَةِ|وَأَمَّا عَادٌ فَأُهْلِكُوا بِرِيحٍ صَرْصَرٍ عَاتِيَةٍ|سَخَّرَهَا عَلَيْهِمْ سَبْعَ لَيَالٍ وَثَمَانِيَةَ أَيَّامٍ حُسُومًا فَتَرَى الْقَوْمَ فِيهَا صَرْعَىٰ كَأَنَّهُمْ أَعْجَازُ نَخْلٍ خَاوِيَةٍ|فَهَلْ تَرَىٰ لَهُم مِّن بَاقِيَةٍ|وَجَاءَ فِرْعَوْنُ وَمَن قَبْلَهُ وَالْمُؤْتَفِكَاتُ بِالْخَاطِئَةِ|فَعَصَوْا رَسُولَ رَبِّهِمْ فَأَخَذَهُمْ أَخْذَةً رَّابِيَةً|إِنَّا لَمَّا طَغَى الْمَاءُ حَمَلْنَاكُمْ فِي الْجَارِيَةِ|لِنَجْعَلَهَا لَكُمْ تَذْكِرَةً وَتَعِيَهَا أُذُنٌ وَاعِيَةٌ|فَإِذَا نُفِخَ فِي الصُّورِ نَفْخَةٌ وَاحِدَةٌ|وَحُمِلَتِ الْأَرْضُ وَالْجِبَالُ فَدُكَّتَا دَكَّةً وَاحِدَةً|فَيَوْمَئِذٍ وَقَعَتِ الْوَاقِعَةُ|وَانشَقَّتِ السَّمَاءُ فَهِيَ يَوْمَئِذٍ وَاهِيَةٌ|وَالْمَلَكُ عَلَىٰ أَرْجَائِهَا ۚ وَيَحْمِلُ عَرْشَ رَبِّكَ فَوْقَهُمْ يَوْمَئِذٍ ثَمَانِيَةٌ|يَوْمَئِذٍ تُعْرَضُونَ لَا تَخْفَىٰ مِنكُمْ خَافِيَةٌ|فَأَمَّا مَنْ أُوتِيَ كِتَابَهُ بِيَمِينِهِ فَيَقُولُ هَاؤُمُ اقْرَءُوا كِتَابِيَهْ|إِنِّي ظَنَنتُ أَنِّي مُلَاقٍ حِسَابِيَهْ|فَهُوَ فِي عِيشَةٍ رَّاضِيَةٍ|فِي جَنَّةٍ عَالِيَةٍ|قُطُوفُهَا دَانِيَةٌ|كُلُوا وَاشْرَبُوا هَنِيئًا بِمَا أَسْلَفْتُمْ فِي الْأَيَّامِ الْخَالِيَةِ|وَأَمَّا مَنْ أُوتِيَ كِتَابَهُ بِشِمَالِهِ فَيَقُولُ يَا لَيْتَنِي لَمْ أُوتَ كِتَابِيَهْ|وَلَمْ أَدْرِ مَا حِسَابِيَهْ|يَا لَيْتَهَا كَانَتِ الْقَاضِيَةَ|مَا أَغْنَىٰ عَنِّي مَالِيَهْ|هَلَكَ عَنِّي سُلْطَانِيَهْ|خُذُوهُ فَغُلُّوهُ|ثُمَّ الْجَحِيمَ صَلُّوهُ|ثُمَّ فِي سِلْسِلَةٍ ذَرْعُهَا سَبْعُونَ ذِرَاعًا فَاسْلُكُوهُ|إِنَّهُ كَانَ لَا يُؤْمِنُ بِاللَّهِ الْعَظِيمِ|وَلَا يَحُضُّ عَلَىٰ طَعَامِ الْمِسْكِينِ|فَلَيْسَ لَهُ الْيَوْمَ هَاهُنَا حَمِيمٌ|وَلَا طَعَامٌ إِلَّا مِنْ غِسْلِينٍ|لَّا يَأْكُلُهُ إِلَّا الْخَاطِئُونَ|فَلَا أُقْسِمُ بِمَا تُبْصِرُونَ|وَمَا لَا تُبْصِرُونَ|إِنَّهُ لَقَوْلُ رَسُولٍ كَرِيمٍ|وَمَا هُوَ بِقَوْلِ شَاعِرٍ ۚ قَلِيلًا مَّا تُؤْمِنُونَ|وَلَا بِقَوْلِ كَاهِنٍ ۚ قَلِيلًا مَّا تَذَكَّرُونَ|تَنزِيلٌ مِّن رَّبِّ الْعَالَمِينَ|وَلَوْ تَقَوَّلَ عَلَيْنَا بَعْضَ الْأَقَاوِيلِ|لَأَخَذْنَا مِنْهُ بِالْيَمِينِ|ثُمَّ لَقَطَعْنَا مِنْهُ الْوَتِينَ|فَمَا مِنكُم مِّنْ أَحَدٍ عَنْهُ حَاجِزِينَ|وَإِنَّهُ لَتَذْكِرَةٌ لِّلْمُتَّقِينَ|وَإِنَّا لَنَعْلَمُ أَنَّ مِنكُم مُّكَذِّبِينَ|وَإِنَّهُ لَحَسْرَةٌ عَلَى الْكَافِرِينَ|وَإِنَّهُ لَحَقُّ الْيَقِينِ|فَسَبِّحْ بِاسْمِ رَبِّكَ الْعَظِيمِ"),T(70,"المعارج","Al-Ma'arij","سَأَلَ سَائِلٌ بِعَذَابٍ وَاقِعٍ|لِّلْكَافِرِينَ لَيْسَ لَهُ دَافِعٌ|مِّنَ اللَّهِ ذِي الْمَعَارِجِ|تَعْرُجُ الْمَلَائِكَةُ وَالرُّوحُ إِلَيْهِ فِي يَوْمٍ كَانَ مِقْدَارُهُ خَمْسِينَ أَلْفَ سَنَةٍ|فَاصْبِرْ صَبْرًا جَمِيلًا|إِنَّهُمْ يَرَوْنَهُ بَعِيدًا|وَنَرَاهُ قَرِيبًا|يَوْمَ تَكُونُ السَّمَاءُ كَالْمُهْلِ|وَتَكُونُ الْجِبَالُ كَالْعِهْنِ|وَلَا يَسْأَلُ حَمِيمٌ حَمِيمًا|يُبَصَّرُونَهُمْ ۚ يَوَدُّ الْمُجْرِمُ لَوْ يَفْتَدِي مِنْ عَذَابِ يَوْمِئِذٍ بِبَنِيهِ|وَصَاحِبَتِهِ وَأَخِيهِ|وَفَصِيلَتِهِ الَّتِي تُؤْوِيهِ|وَمَن فِي الْأَرْضِ جَمِيعًا ثُمَّ يُنجِيهِ|كَلَّا ۖ إِنَّهَا لَظَىٰ|نَزَّاعَةً لِّلشَّوَىٰ|تَدْعُو مَنْ أَدْبَرَ وَتَوَلَّىٰ|وَجَمَعَ فَأَوْعَىٰ|إِنَّ الْإِنسَانَ خُلِقَ هَلُوعًا|إِذَا مَسَّهُ الشَّرُّ جَزُوعًا|وَإِذَا مَسَّهُ الْخَيْرُ مَنُوعًا|إِلَّا الْمُصَلِّينَ|الَّذِينَ هُمْ عَلَىٰ صَلَاتِهِمْ دَائِمُونَ|وَالَّذِينَ فِي أَمْوَالِهِمْ حَقٌّ مَّعْلُومٌ|لِّلسَّائِلِ وَالْمَحْرُومِ|وَالَّذِينَ يُصَدِّقُونَ بِيَوْمِ الدِّينِ|وَالَّذِينَ هُم مِّنْ عَذَابِ رَبِّهِم مُّشْفِقُونَ|إِنَّ عَذَابَ رَبِّهِمْ غَيْرُ مَأْمُونٍ|وَالَّذِينَ هُمْ لِفُرُوجِهِمْ حَافِظُونَ|إِلَّا عَلَىٰ أَزْوَاجِهِمْ أَوْ مَا مَلَكَتْ أَيْمَانُهُمْ فَإِنَّهُمْ غَيْرُ مَلُومِينَ|فَمَنِ ابْتَغَىٰ وَرَاءَ ذَٰلِكَ فَأُولَٰئِكَ هُمُ الْعَادُونَ|وَالَّذِينَ هُمْ لِأَمَانَاتِهِمْ وَعَهْدِهِمْ رَاعُونَ|وَالَّذِينَ هُم بِشَهَادَاتِهِمْ قَائِمُونَ|وَالَّذِينَ هُمْ عَلَىٰ صَلَاتِهِمْ يُحَافِظُونَ|أُولَٰئِكَ فِي جَنَّاتٍ مُّكْرَمُونَ|فَمَالِ الَّذِينَ كَفَرُوا قِبَلَكَ مُهْطِعِينَ|عَنِ الْيَمِينِ وَعَنِ الشِّمَالِ عِزِينَ|أَيَطْمَعُ كُلُّ امْرِئٍ مِّنْهُمْ أَن يُدْخَلَ جَنَّةَ نَعِيمٍ|كَلَّا ۖ إِنَّا خَلَقْنَاهُم مِّمَّا يَعْلَمُونَ|فَلَا أُقْسِمُ بِرَبِّ الْمَشَارِقِ وَالْمَغَارِبِ إِنَّا لَقَادِرُونَ|عَلَىٰ أَن نُّبَدِّلَ خَيْرًا مِّنْهُمْ وَمَا نَحْنُ بِمَسْبُوقِينَ|فَذَرْهُمْ يَخُوضُوا وَيَلْعَبُوا حَتَّىٰ يُلَاقُوا يَوْمَهُمُ الَّذِي يُوعَدُونَ|يَوْمَ يَخْرُجُونَ مِنَ الْأَجْدَاثِ سِرَاعًا كَأَنَّهُمْ إِلَىٰ نُصُبٍ يُوفِضُونَ|خَاشِعَةً أَبْصَارُهُمْ تَرْهَقُهُمْ ذِلَّةٌ ۚ ذَٰلِكَ الْيَوْمُ الَّذِي كَانُوا يُوعَدُونَ"),T(71,"نوح","Nuh","إِنَّا أَرْسَلْنَا نُوحًا إِلَىٰ قَوْمِهِ أَنْ أَنذِرْ قَوْمَكَ مِن قَبْلِ أَن يَأْتِيَهُمْ عَذَابٌ أَلِيمٌ|قَالَ يَا قَوْمِ إِنِّي لَكُمْ نَذِيرٌ مُّبِينٌ|أَنِ اعْبُدُوا اللَّهَ وَاتَّقُوهُ وَأَطِيعُونِ|يَغْفِرْ لَكُم مِّن ذُنُوبِكُمْ وَيُؤَخِّرْكُمْ إِلَىٰ أَجَلٍ مُّسَمًّى ۚ إِنَّ أَجَلَ اللَّهِ إِذَا جَاءَ لَا يُؤَخَّرُ ۚ لَوْ كُنتُمْ تَعْلَمُونَ|قَالَ رَبِّ إِنِّي دَعَوْتُ قَوْمِي لَيْلًا وَنَهَارًا|فَلَمْ يَزِدْهُمْ دُعَائِي إِلَّا فِرَارًا|وَإِنِّي كُلَّمَا دَعَوْتُهُمْ لِتَغْفِرَ لَهُمْ جَعَلُوا أَصَابِعَهُمْ فِي آذَانِهِمْ وَاسْتَغْشَوْا ثِيَابَهُمْ وَأَصَرُّوا وَاسْتَكْبَرُوا اسْتِكْبَارًا|ثُمَّ إِنِّي دَعَوْتُهُمْ جِهَارًا|ثُمَّ إِنِّي أَعْلَنتُ لَهُمْ وَأَسْرَرْتُ لَهُمْ إِسْرَارًا|فَقُلْتُ اسْتَغْفِرُوا رَبَّكُمْ إِنَّهُ كَانَ غَفَّارًا|يُرْسِلِ السَّمَاءَ عَلَيْكُم مِّدْرَارًا|وَيُمْدِدْكُم بِأَمْوَالٍ وَبَنِينَ وَيَجْعَل لَّكُمْ جَنَّاتٍ وَيَجْعَل لَّكُمْ أَنْهَارًا|مَّا لَكُمْ لَا تَرْجُونَ لِلَّهِ وَقَارًا|وَقَدْ خَلَقَكُمْ أَطْوَارًا|أَلَمْ تَرَوْا كَيْفَ خَلَقَ اللَّهُ سَبْعَ سَمَاوَاتٍ طِبَاقًا|وَجَعَلَ الْقَمَرَ فِيهِنَّ نُورًا وَجَعَلَ الشَّمْسَ سِرَاجًا|وَاللَّهُ أَنبَتَكُم مِّنَ الْأَرْضِ نَبَاتًا|ثُمَّ يُعِيدُكُمْ فِيهَا وَيُخْرِجُكُمْ إِخْرَاجًا|وَاللَّهُ جَعَلَ لَكُمُ الْأَرْضَ بِسَاطًا|لِّتَسْلُكُوا مِنْهَا سُبُلًا فِجَاجًا|قَالَ نُوحٌ رَّبِّ إِنَّهُمْ عَصَوْنِي وَاتَّبَعُوا مَن لَّمْ يَزِدْهُ مَالُهُ وَوَلَدُهُ إِلَّا خَسَارًا|وَمَكَرُوا مَكْرًا كُبَّارًا|وَقَالُوا لَا تَذَرُنَّ آلِهَتَكُمْ وَلَا تَذَرُنَّ وَدًّا وَلَا سُوَاعًا وَلَا يَغُوثَ وَيَعُوقَ وَنَسْرًا|وَقَدْ أَضَلُّوا كَثِيرًا ۖ وَلَا تَزِدِ الظَّالِمِينَ إِلَّا ضَلَالًا|مِّمَّا خَطِيئَاتِهِمْ أُغْرِقُوا فَأُدْخِلُوا نَارًا فَلَمْ يَجِدُوا لَهُم مِّن دُونِ اللَّهِ أَنصَارًا|وَقَالَ نُوحٌ رَّبِّ لَا تَذَرْ عَلَى الْأَرْضِ مِنَ الْكَافِرِينَ دَيَّارًا|إِنَّكَ إِن تَذَرْهُمْ يُضِلُّوا عِبَادَكَ وَلَا يَلِدُوا إِلَّا فَاجِرًا كَفَّارًا|رَّبِّ اغْفِرْ لِي وَلِوَالِدَيَّ وَلِمَن دَخَلَ بَيْتِيَ مُؤْمِنًا وَلِلْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ وَلَا تَزِدِ الظَّالِمِينَ إِلَّا تَبَارًا"),T(72,"الجن","Al-Jinn","قُلْ أُوحِيَ إِلَيَّ أَنَّهُ اسْتَمَعَ نَفَرٌ مِّنَ الْجِنِّ فَقَالُوا إِنَّا سَمِعْنَا قُرْآنًا عَجَبًا|يَهْدِي إِلَى الرُّشْدِ فَآمَنَّا بِهِ ۖ وَلَن نُّشْرِكَ بِرَبِّنَا أَحَدًا|وَأَنَّهُ تَعَالَىٰ جَدُّ رَبِّنَا مَا اتَّخَذَ صَاحِبَةً وَلَا وَلَدًا|وَأَنَّهُ كَانَ يَقُولُ سَفِيهُنَا عَلَى اللَّهِ شَطَطًا|وَأَنَّا ظَنَنَّا أَن لَّن تَقُولَ الْإِنسُ وَالْجِنُّ عَلَى اللَّهِ كَذِبًا|وَأَنَّهُ كَانَ رِجَالٌ مِّنَ الْإِنسِ يَعُوذُونَ بِرِجَالٍ مِّنَ الْجِنِّ فَزَادُوهُمْ رَهَقًا|وَأَنَّهُمْ ظَنُّوا كَمَا ظَنَنتُمْ أَن لَّن يَبْعَثَ اللَّهُ أَحَدًا|وَأَنَّا لَمَسْنَا السَّمَاءَ فَوَجَدْنَاهَا مُلِئَتْ حَرَسًا شَدِيدًا وَشُهُبًا|وَأَنَّا كُنَّا نَقْعُدُ مِنْهَا مَقَاعِدَ لِلسَّمْعِ ۖ فَمَن يَسْتَمِعِ الْآنَ يَجِدْ لَهُ شِهَابًا رَّصَدًا|وَأَنَّا لَا نَدْرِي أَشَرٌّ أُرِيدَ بِمَن فِي الْأَرْضِ أَمْ أَرَادَ بِهِمْ رَبُّهُمْ رَشَدًا|وَأَنَّا مِنَّا الصَّالِحُونَ وَمِنَّا دُونَ ذَٰلِكَ ۖ كُنَّا طَرَائِقَ قِدَدًا|وَأَنَّا ظَنَنَّا أَن لَّن نُّعْجِزَ اللَّهَ فِي الْأَرْضِ وَلَن نُّعْجِزَهُ هَرَبًا|وَأَنَّا لَمَّا سَمِعْنَا الْهُدَىٰ آمَنَّا بِهِ ۖ فَمَن يُؤْمِن بِرَبِّهِ فَلَا يَخَافُ بَخْسًا وَلَا رَهَقًا|وَأَنَّا مِنَّا الْمُسْلِمُونَ وَمِنَّا الْقَاسِطُونَ ۖ فَمَنْ أَسْلَمَ فَأُولَٰئِكَ تَحَرَّوْا رَشَدًا|وَأَمَّا الْقَاسِطُونَ فَكَانُوا لِجَهَنَّمَ حَطَبًا|وَأَلَّوِ اسْتَقَامُوا عَلَى الطَّرِيقَةِ لَأَسْقَيْنَاهُم مَّاءً غَدَقًا|لِّنَفْتِنَهُمْ فِيهِ ۚ وَمَن يُعْرِضْ عَن ذِكْرِ رَبِّهِ يَسْلُكْهُ عَذَابًا صَعَدًا|وَأَنَّ الْمَسَاجِدَ لِلَّهِ فَلَا تَدْعُوا مَعَ اللَّهِ أَحَدًا|وَأَنَّهُ لَمَّا قَامَ عَبْدُ اللَّهِ يَدْعُوهُ كَادُوا يَكُونُونَ عَلَيْهِ لِبَدًا|قُلْ إِنَّمَا أَدْعُو رَبِّي وَلَا أُشْرِكُ بِهِ أَحَدًا|قُلْ إِنِّي لَا أَمْلِكُ لَكُمْ ضَرًّا وَلَا رَشَدًا|قُلْ إِنِّي لَن يُجِيرَنِي مِنَ اللَّهِ أَحَدٌ وَلَنْ أَجِدَ مِن دُونِهِ مُلْتَحَدًا|إِلَّا بَلَاغًا مِّنَ اللَّهِ وَرِسَالَاتِهِ ۚ وَمَن يَعْصِ اللَّهَ وَرَسُولَهُ فَإِنَّ لَهُ نَارَ جَهَنَّمَ خَالِدِينَ فِيهَا أَبَدًا|حَتَّىٰ إِذَا رَأَوْا مَا يُوعَدُونَ فَسَيَعْلَمُونَ مَنْ أَضْعَفُ نَاصِرًا وَأَقَلُّ عَدَدًا|قُلْ إِنْ أَدْرِي أَقَرِيبٌ مَّا تُوعَدُونَ أَمْ يَجْعَلُ لَهُ رَبِّي أَمَدًا|عَالِمُ الْغَيْبِ فَلَا يُظْهِرُ عَلَىٰ غَيْبِهِ أَحَدًا|إِلَّا مَنِ ارْتَضَىٰ مِن رَّسُولٍ فَإِنَّهُ يَسْلُكُ مِن بَيْنِ يَدَيْهِ وَمِنْ خَلْفِهِ رَصَدًا|لِّيَعْلَمَ أَن قَدْ أَبْلَغُوا رِسَالَاتِ رَبِّهِمْ وَأَحَاطَ بِمَا لَدَيْهِمْ وَأَحْصَىٰ كُلَّ شَيْءٍ عَدَدًا"),T(73,"المزمل","Al-Muzzammil","يَا أَيُّهَا الْمُزَّمِّلُ|قُمِ اللَّيْلَ إِلَّا قَلِيلًا|نِّصْفَهُ أَوِ انقُصْ مِنْهُ قَلِيلًا|أَوْ زِدْ عَلَيْهِ وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا|إِنَّا سَنُلْقِي عَلَيْكَ قَوْلًا ثَقِيلًا|إِنَّ نَاشِئَةَ اللَّيْلِ هِيَ أَشَدُّ وَطْئًا وَأَقْوَمُ قِيلًا|إِنَّ لَكَ فِي النَّهَارِ سَبْحًا طَوِيلًا|وَاذْكُرِ اسْمَ رَبِّكَ وَتَبَتَّلْ إِلَيْهِ تَبْتِيلًا|رَّبُّ الْمَشْرِقِ وَالْمَغْرِبِ لَا إِلَٰهَ إِلَّا هُوَ فَاتَّخِذْهُ وَكِيلًا|وَاصْبِرْ عَلَىٰ مَا يَقُولُونَ وَاهْجُرْهُمْ هَجْرًا جَمِيلًا|وَذَرْنِي وَالْمُكَذِّبِينَ أُولِي النَّعْمَةِ وَمَهِّلْهُمْ قَلِيلًا|إِنَّ لَدَيْنَا أَنكَالًا وَجَحِيمًا|وَطَعَامًا ذَا غُصَّةٍ وَعَذَابًا أَلِيمًا|يَوْمَ تَرْجُفُ الْأَرْضُ وَالْجِبَالُ وَكَانَتِ الْجِبَالُ كَثِيبًا مَّهِيلًا|إِنَّا أَرْسَلْنَا إِلَيْكُمْ رَسُولًا شَاهِدًا عَلَيْكُمْ كَمَا أَرْسَلْنَا إِلَىٰ فِرْعَوْنَ رَسُولًا|فَعَصَىٰ فِرْعَوْنُ الرَّسُولَ فَأَخَذْنَاهُ أَخْذًا وَبِيلًا|فَكَيْفَ تَتَّقُونَ إِن كَفَرْتُمْ يَوْمًا يَجْعَلُ الْوِلْدَانَ شِيبًا|السَّمَاءُ مُنفَطِرٌ بِهِ ۚ كَانَ وَعْدُهُ مَفْعُولًا|إِنَّ هَٰذِهِ تَذْكِرَةٌ ۖ فَمَن شَاءَ اتَّخَذَ إِلَىٰ رَبِّهِ سَبِيلًا|إِنَّ رَبَّكَ يَعْلَمُ أَنَّكَ تَقُومُ أَدْنَىٰ مِن ثُلُثَيِ اللَّيْلِ وَنِصْفَهُ وَثُلُثَهُ وَطَائِفَةٌ مِّنَ الَّذِينَ مَعَكَ ۚ وَاللَّهُ يُقَدِّرُ اللَّيْلَ وَالنَّهَارَ ۚ عَلِمَ أَن لَّن تُحْصُوهُ فَتَابَ عَلَيْكُمْ ۖ فَاقْرَءُوا مَا تَيَسَّرَ مِنَ الْقُرْآنِ ۚ عَلِمَ أَن سَيَكُونُ مِنكُم مَّرْضَىٰ ۙ وَآخَرُونَ يَضْرِبُونَ فِي الْأَرْضِ يَبْتَغُونَ مِن فَضْلِ اللَّهِ ۙ وَآخَرُونَ يُقَاتِلُونَ فِي سَبِيلِ اللَّهِ ۖ فَاقْرَءُوا مَا تَيَسَّرَ مِنْهُ ۚ وَأَقِيمُوا الصَّلَاةَ وَآتُوا الزَّكَاةَ وَأَقْرِضُوا اللَّهَ قَرْضًا حَسَنًا ۚ وَمَا تُقَدِّمُوا لِأَنفُسِكُم مِّنْ خَيْرٍ تَجِدُوهُ عِندَ اللَّهِ هُوَ خَيْرًا وَأَعْظَمَ أَجْرًا ۚ وَاسْتَغْفِرُوا اللَّهَ ۖ إِنَّ اللَّهَ غَفُورٌ رَّحِيمٌ"),T(74,"المدثر","Al-Muddaththir","يَا أَيُّهَا الْمُدَّثِّرُ|قُمْ فَأَنذِرْ|وَرَبَّكَ فَكَبِّرْ|وَثِيَابَكَ فَطَهِّرْ|وَالرُّجْزَ فَاهْجُرْ|وَلَا تَمْنُن تَسْتَكْثِرُ|وَلِرَبِّكَ فَاصْبِرْ|فَإِذَا نُقِرَ فِي النَّاقُورِ|فَذَٰلِكَ يَوْمَئِذٍ يَوْمٌ عَسِيرٌ|عَلَى الْكَافِرِينَ غَيْرُ يَسِيرٍ|ذَرْنِي وَمَنْ خَلَقْتُ وَحِيدًا|وَجَعَلْتُ لَهُ مَالًا مَّمْدُودًا|وَبَنِينَ شُهُودًا|وَمَهَّدتُّ لَهُ تَمْهِيدًا|ثُمَّ يَطْمَعُ أَنْ أَزِيدَ|كَلَّا ۖ إِنَّهُ كَانَ لِآيَاتِنَا عَنِيدًا|سَأُرْهِقُهُ صَعُودًا|إِنَّهُ فَكَّرَ وَقَدَّرَ|فَقُتِلَ كَيْفَ قَدَّرَ|ثُمَّ قُتِلَ كَيْفَ قَدَّرَ|ثُمَّ نَظَرَ|ثُمَّ عَبَسَ وَبَسَرَ|ثُمَّ أَدْبَرَ وَاسْتَكْبَرَ|فَقَالَ إِنْ هَٰذَا إِلَّا سِحْرٌ يُؤْثَرُ|إِنْ هَٰذَا إِلَّا قَوْلُ الْبَشَرِ|سَأُصْلِيهِ سَقَرَ|وَمَا أَدْرَاكَ مَا سَقَرُ|لَا تُبْقِي وَلَا تَذَرُ|لَوَّاحَةٌ لِّلْبَشَرِ|عَلَيْهَا تِسْعَةَ عَشَرَ|وَمَا جَعَلْنَا أَصْحَابَ النَّارِ إِلَّا مَلَائِكَةً ۙ وَمَا جَعَلْنَا عِدَّتَهُمْ إِلَّا فِتْنَةً لِّلَّذِينَ كَفَرُوا لِيَسْتَيْقِنَ الَّذِينَ أُوتُوا الْكِتَابَ وَيَزْدَادَ الَّذِينَ آمَنُوا إِيمَانًا ۙ وَلَا يَرْتَابَ الَّذِينَ أُوتُوا الْكِتَابَ وَالْمُؤْمِنُونَ ۙ وَلِيَقُولَ الَّذِينَ فِي قُلُوبِهِم مَّرَضٌ وَالْكَافِرُونَ مَاذَا أَرَادَ اللَّهُ بِهَٰذَا مَثَلًا ۚ كَذَٰلِكَ يُضِلُّ اللَّهُ مَن يَشَاءُ وَيَهْدِي مَن يَشَاءُ ۚ وَمَا يَعْلَمُ جُنُودَ رَبِّكَ إِلَّا هُوَ ۚ وَمَا هِيَ إِلَّا ذِكْرَىٰ لِلْبَشَرِ|كَلَّا وَالْقَمَرِ|وَاللَّيْلِ إِذْ أَدْبَرَ|وَالصُّبْحِ إِذَا أَسْفَرَ|إِنَّهَا لَإِحْدَى الْكُبَرِ|نَذِيرًا لِّلْبَشَرِ|لِمَن شَاءَ مِنكُمْ أَن يَتَقَدَّمَ أَوْ يَتَأَخَّرَ|كُلُّ نَفْسٍ بِمَا كَسَبَتْ رَهِينَةٌ|إِلَّا أَصْحَابَ الْيَمِينِ|فِي جَنَّاتٍ يَتَسَاءَلُونَ|عَنِ الْمُجْرِمِينَ|مَا سَلَكَكُمْ فِي سَقَرَ|قَالُوا لَمْ نَكُ مِنَ الْمُصَلِّينَ|وَلَمْ نَكُ نُطْعِمُ الْمِسْكِينَ|وَكُنَّا نَخُوضُ مَعَ الْخَائِضِينَ|وَكُنَّا نُكَذِّبُ بِيَوْمِ الدِّينِ|حَتَّىٰ أَتَانَا الْيَقِينُ|فَمَا تَنفَعُهُمْ شَفَاعَةُ الشَّافِعِينَ|فَمَا لَهُمْ عَنِ التَّذْكِرَةِ مُعْرِضِينَ|كَأَنَّهُمْ حُمُرٌ مُّسْتَنفِرَةٌ|فَرَّتْ مِن قَسْوَرَةٍ|بَلْ يُرِيدُ كُلُّ امْرِئٍ مِّنْهُمْ أَن يُؤْتَىٰ صُحُفًا مُّنَشَّرَةً|كَلَّا ۖ بَل لَّا يَخَافُونَ الْآخِرَةَ|كَلَّا إِنَّهُ تَذْكِرَةٌ|فَمَن شَاءَ ذَكَرَهُ|وَمَا يَذْكُرُونَ إِلَّا أَن يَشَاءَ اللَّهُ ۚ هُوَ أَهْلُ التَّقْوَىٰ وَأَهْلُ الْمَغْفِرَةِ"),T(75,"القيامة","Al-Qiyamah","لَا أُقْسِمُ بِيَوْمِ الْقِيَامَةِ|وَلَا أُقْسِمُ بِالنَّفْسِ اللَّوَّامَةِ|أَيَحْسَبُ الْإِنسَانُ أَلَّن نَّجْمَعَ عِظَامَهُ|بَلَىٰ قَادِرِينَ عَلَىٰ أَن نُّسَوِّيَ بَنَانَهُ|بَلْ يُرِيدُ الْإِنسَانُ لِيَفْجُرَ أَمَامَهُ|يَسْأَلُ أَيَّانَ يَوْمُ الْقِيَامَةِ|فَإِذَا بَرِقَ الْبَصَرُ|وَخَسَفَ الْقَمَرُ|وَجُمِعَ الشَّمْسُ وَالْقَمَرُ|يَقُولُ الْإِنسَانُ يَوْمَئِذٍ أَيْنَ الْمَفَرُّ|كَلَّا لَا وَزَرَ|إِلَىٰ رَبِّكَ يَوْمَئِذٍ الْمُسْتَقَرُّ|يُنَبَّأُ الْإِنسَانُ يَوْمَئِذٍ بِمَا قَدَّمَ وَأَخَّرَ|بَلِ الْإِنسَانُ عَلَىٰ نَفْسِهِ بَصِيرَةٌ|وَلَوْ أَلْقَىٰ مَعَاذِيرَهُ|لَا تُحَرِّكْ بِهِ لِسَانَكَ لِتَعْجَلَ بِهِ|إِنَّ عَلَيْنَا جَمْعَهُ وَقُرْآنَهُ|فَإِذَا قَرَأْنَاهُ فَاتَّبِعْ قُرْآنَهُ|ثُمَّ إِنَّ عَلَيْنَا بَيَانَهُ|كَلَّا بَلْ تُحِبُّونَ الْعَاجِلَةَ|وَتَذَرُونَ الْآخِرَةَ|وُجُوهٌ يَوْمَئِذٍ نَّاضِرَةٌ|إِلَىٰ رَبِّهَا نَاظِرَةٌ|وَوُجُوهٌ يَوْمَئِذٍ بَاسِرَةٌ|تَظُنُّ أَن يُفْعَلَ بِهَا فَاقِرَةٌ|كَلَّا إِذَا بَلَغَتِ التَّرَاقِيَ|وَقِيلَ مَنْ ۜ رَاقٍ|وَظَنَّ أَنَّهُ الْفِرَاقُ|وَالْتَفَّتِ السَّاقُ بِالسَّاقِ|إِلَىٰ رَبِّكَ يَوْمَئِذٍ الْمَسَاقُ|فَلَا صَدَّقَ وَلَا صَلَّىٰ|وَلَٰكِن كَذَّبَ وَتَوَلَّىٰ|ثُمَّ ذَهَبَ إِلَىٰ أَهْلِهِ يَتَمَطَّىٰ|أَوْلَىٰ لَكَ فَأَوْلَىٰ|ثُمَّ أَوْلَىٰ لَكَ فَأَوْلَىٰ|أَيَحْسَبُ الْإِنسَانُ أَن يُتْرَكَ سُدًى|أَلَمْ يَكُ نُطْفَةً مِّن مَّنِيٍّ يُمْنَىٰ|ثُمَّ كَانَ عَلَقَةً فَخَلَقَ فَسَوَّىٰ|فَجَعَلَ مِنْهُ الزَّوْجَيْنِ الذَّكَرَ وَالْأُنثَىٰ|أَلَيْسَ ذَٰلِكَ بِقَادِرٍ عَلَىٰ أَن يُحْيِيَ الْمَوْتَىٰ"),T(76,"الإنسان","Al-Insan","هَلْ أَتَىٰ عَلَى الْإِنسَانِ حِينٌ مِّنَ الدَّهْرِ لَمْ يَكُن شَيْئًا مَّذْكُورًا|إِنَّا خَلَقْنَا الْإِنسَانَ مِن نُّطْفَةٍ أَمْشَاجٍ نَّبْتَلِيهِ فَجَعَلْنَاهُ سَمِيعًا بَصِيرًا|إِنَّا هَدَيْنَاهُ السَّبِيلَ إِمَّا شَاكِرًا وَإِمَّا كَفُورًا|إِنَّا أَعْتَدْنَا لِلْكَافِرِينَ سَلَاسِلَ وَأَغْلَالًا وَسَعِيرًا|إِنَّ الْأَبْرَارَ يَشْرَبُونَ مِن كَأْسٍ كَانَ مِزَاجُهَا كَافُورًا|عَيْنًا يَشْرَبُ بِهَا عِبَادُ اللَّهِ يُفَجِّرُونَهَا تَفْجِيرًا|يُوفُونَ بِالنَّذْرِ وَيَخَافُونَ يَوْمًا كَانَ شَرُّهُ مُسْتَطِيرًا|وَيُطْعِمُونَ الطَّعَامَ عَلَىٰ حُبِّهِ مِسْكِينًا وَيَتِيمًا وَأَسِيرًا|إِنَّمَا نُطْعِمُكُمْ لِوَجْهِ اللَّهِ لَا نُرِيدُ مِنكُمْ جَزَاءً وَلَا شُكُورًا|إِنَّا نَخَافُ مِن رَّبِّنَا يَوْمًا عَبُوسًا قَمْطَرِيرًا|فَوَقَاهُمُ اللَّهُ شَرَّ ذَٰلِكَ الْيَوْمِ وَلَقَّاهُمْ نَضْرَةً وَسُرُورًا|وَجَزَاهُم بِمَا صَبَرُوا جَنَّةً وَحَرِيرًا|مُّتَّكِئِينَ فِيهَا عَلَى الْأَرَائِكِ ۖ لَا يَرَوْنَ فِيهَا شَمْسًا وَلَا زَمْهَرِيرًا|وَدَانِيَةً عَلَيْهِمْ ظِلَالُهَا وَذُلِّلَت قُطُوفُهَا تَذْلِيلًا|وَيُطَافُ عَلَيْهِم بِآنِيَةٍ مِّن فِضَّةٍ وَأَكْوَابٍ كَانَتْ قَوَارِيرَا|قَوَارِيرَ مِن فِضَّةٍ قَدَّرُوهَا تَقْدِيرًا|وَيُسْقَوْنَ فِيهَا كَأْسًا كَانَ مِزَاجُهَا زَنجَبِيلًا|عَيْنًا فِيهَا تُسَمَّىٰ سَلْسَبِيلًا|وَيَطُوفُ عَلَيْهِمْ وِلْدَانٌ مُّخَلَّدُونَ إِذَا رَأَيْتَهُمْ حَسِبْتَهُمْ لُؤْلُؤًا مَّنثُورًا|وَإِذَا رَأَيْتَ ثَمَّ رَأَيْتَ نَعِيمًا وَمُلْكًا كَبِيرًا|عَالِيَهُمْ ثِيَابُ سُندُسٍ خُضْرٌ وَإِسْتَبْرَقٌ ۖ وَحُلُّوا أَسَاوِرَ مِن فِضَّةٍ وَسَقَاهُمْ رَبُّهُمْ شَرَابًا طَهُورًا|إِنَّ هَٰذَا كَانَ لَكُمْ جَزَاءً وَكَانَ سَعْيُكُم مَّشْكُورًا|إِنَّا نَحْنُ نَزَّلْنَا عَلَيْكَ الْقُرْآنَ تَنزِيلًا|فَاصْبِرْ لِحُكْمِ رَبِّكَ وَلَا تُطِعْ مِنْهُمْ آثِمًا أَوْ كَفُورًا|وَاذْكُرِ اسْمَ رَبِّكَ بُكْرَةً وَأَصِيلًا|وَمِنَ اللَّيْلِ فَاسْجُدْ لَهُ وَسَبِّحْهُ لَيْلًا طَوِيلًا|إِنَّ هَٰؤُلَاءِ يُحِبُّونَ الْعَاجِلَةَ وَيَذَرُونَ وَرَاءَهُمْ يَوْمًا ثَقِيلًا|نَّحْنُ خَلَقْنَاهُمْ وَشَدَدْنَا أَسْرَهُمْ ۖ وَإِذَا شِئْنَا بَدَّلْنَا أَمْثَالَهُمْ تَبْدِيلًا|إِنَّ هَٰذِهِ تَذْكِرَةٌ ۖ فَمَن شَاءَ اتَّخَذَ إِلَىٰ رَبِّهِ سَبِيلًا|وَمَا تَشَاءُونَ إِلَّا أَن يَشَاءَ اللَّهُ ۚ إِنَّ اللَّهَ كَانَ عَلِيمًا حَكِيمًا|يُدْخِلُ مَن يَشَاءُ فِي رَحْمَتِهِ ۚ وَالظَّالِمِينَ أَعَدَّ لَهُمْ عَذَابًا أَلِيمًا"),T(77,"المرسلات","Al-Mursalat","وَالْمُرْسَلَاتِ عُرْفًا|فَالْعَاصِفَاتِ عَصْفًا|وَالنَّاشِرَاتِ نَشْرًا|فَالْفَارِقَاتِ فَرْقًا|فَالْمُلْقِيَاتِ ذِكْرًا|عُذْرًا أَوْ نُذْرًا|إِنَّمَا تُوعَدُونَ لَوَاقِعٌ|فَإِذَا النُّجُومُ طُمِسَتْ|وَإِذَا السَّمَاءُ فُرِجَتْ|وَإِذَا الْجِبَالُ نُسِفَتْ|وَإِذَا الرُّسُلُ أُقِّتَتْ|لِأَيِّ يَوْمٍ أُجِّلَتْ|لِيَوْمِ الْفَصْلِ|وَمَا أَدْرَاكَ مَا يَوْمُ الْفَصْلِ|وَيْلٌ يَوْمَئِذٍ لِّلْمُكَذِّبِينَ|أَلَمْ نُهْلِكِ الْأَوَّلِينَ|ثُمَّ نُتْبِعُهُمُ الْآخِرِينَ|كَذَٰلِكَ نَفْعَلُ بِالْمُجْرِمِينَ|وَيْلٌ يَوْمَئِذٍ لِّلْمُكَذِّبِينَ|أَلَمْ نَخْلُقكُّم مِّن مَّاءٍ مَّهِينٍ|فَجَعَلْنَاهُ فِي قَرَارٍ مَّكِينٍ|إِلَىٰ قَدَرٍ مَّعْلُومٍ|فَقَدَرْنَا فَنِعْمَ الْقَادِرُونَ|وَيْلٌ يَوْمَئِذٍ لِّلْمُكَذِّبِينَ|أَلَمْ نَجْعَلِ الْأَرْضَ كِفَاتًا|أَحْيَاءً وَأَمْوَاتًا|وَجَعَلْنَا فِيهَا رَوَاسِيَ شَامِخَاتٍ وَأَسْقَيْنَاكُم مَّاءً فُرَاتًا|وَيْلٌ يَوْمَئِذٍ لِّلْمُكَذِّبِينَ|انطَلِقُوا إِلَىٰ مَا كُنتُم بِهِ تُكَذِّبُونَ|انطَلِقُوا إِلَىٰ ظِلٍّ ذِي ثَلَاثِ شُعَبٍ|لَّا ظَلِيلٍ وَلَا يُغْنِي مِنَ اللَّهَبِ|إِنَّهَا تَرْمِي بِشَرَرٍ كَالْقَصْرِ|كَأَنَّهُ جِمَالَتٌ صُفْرٌ|وَيْلٌ يَوْمَئِذٍ لِّلْمُكَذِّبِينَ|هَٰذَا يَوْمُ لَا يَنطِقُونَ|وَلَا يُؤْذَنُ لَهُمْ فَيَعْتَذِرُونَ|وَيْلٌ يَوْمَئِذٍ لِّلْمُكَذِّبِينَ|هَٰذَا يَوْمُ الْفَصْلِ ۖ جَمَعْنَاكُمْ وَالْأَوَّلِينَ|فَإِن كَانَ لَكُمْ كَيْدٌ فَكِيدُونِ|وَيْلٌ يَوْمَئِذٍ لِّلْمُكَذِّبِينَ|إِنَّ الْمُتَّقِينَ فِي ظِلَالٍ وَعُيُونٍ|وَفَوَاكِهَ مِمَّا يَشْتَهُونَ|كُلُوا وَاشْرَبُوا هَنِيئًا بِمَا كُنتُمْ تَعْمَلُونَ|إِنَّا كَذَٰلِكَ نَجْزِي الْمُحْسِنِينَ|وَيْلٌ يَوْمَئِذٍ لِّلْمُكَذِّبِينَ|كُلُوا وَتَمَتَّعُوا قَلِيلًا إِنَّكُم مُّجْرِمُونَ|وَيْلٌ يَوْمَئِذٍ لِّلْمُكَذِّبِينَ|وَإِذَا قِيلَ لَهُمُ ارْكَعُوا لَا يَرْكَعُونَ|وَيْلٌ يَوْمَئِذٍ لِّلْمُكَذِّبِينَ|فَبِأَيِّ حَدِيثٍ بَعْدَهُ يُؤْمِنُونَ"),T(78,"النبأ","An-Naba","عَمَّ يَتَسَاءَلُونَ|عَنِ النَّبَإِ الْعَظِيمِ|الَّذِي هُمْ فِيهِ مُخْتَلِفُونَ|كَلَّا سَيَعْلَمُونَ|ثُمَّ كَلَّا سَيَعْلَمُونَ|أَلَمْ نَجْعَلِ الْأَرْضَ مِهَادًا|وَالْجِبَالَ أَوْتَادًا|وَخَلَقْنَاكُمْ أَزْوَاجًا|وَجَعَلْنَا نَوْمَكُمْ سُبَاتًا|وَجَعَلْنَا اللَّيْلَ لِبَاسًا|وَجَعَلْنَا النَّهَارَ مَعَاشًا|وَبَنَيْنَا فَوْقَكُمْ سَبْعًا شِدَادًا|وَجَعَلْنَا سِرَاجًا وَهَّاجًا|وَأَنزَلْنَا مِنَ الْمُعْصِرَاتِ مَاءً ثَجَّاجًا|لِّنُخْرِجَ بِهِ حَبًّا وَنَبَاتًا|وَجَنَّاتٍ أَلْفَافًا|إِنَّ يَوْمَ الْفَصْلِ كَانَ مِيقَاتًا|يَوْمَ يُنفَخُ فِي الصُّورِ فَتَأْتُونَ أَفْوَاجًا|وَفُتِحَتِ السَّمَاءُ فَكَانَتْ أَبْوَابًا|وَسُيِّرَتِ الْجِبَالُ فَكَانَتْ سَرَابًا|إِنَّ جَهَنَّمَ كَانَتْ مِرْصَادًا|لِّلطَّاغِينَ مَآبًا|لَابِثِينَ فِيهَا أَحْقَابًا|لَّا يَذُوقُونَ فِيهَا بَرْدًا وَلَا شَرَابًا|إِلَّا حَمِيمًا وَغَسَّاقًا|جَزَاءً وِفَاقًا|إِنَّهُمْ كَانُوا لَا يَرْجُونَ حِسَابًا|وَكَذَّبُوا بِآيَاتِنَا كِذَّابًا|وَكُلَّ شَيْءٍ أَحْصَيْنَاهُ كِتَابًا|فَذُوقُوا فَلَن نَّزِيدَكُمْ إِلَّا عَذَابًا|إِنَّ لِلْمُتَّقِينَ مَفَازًا|حَدَائِقَ وَأَعْنَابًا|وَكَوَاعِبَ أَتْرَابًا|وَكَأْسًا دِهَاقًا|لَّا يَسْمَعُونَ فِيهَا لَغْوًا وَلَا كِذَّابًا|جَزَاءً مِّن رَّبِّكَ عَطَاءً حِسَابًا|رَّبِّ السَّمَاوَاتِ وَالْأَرْضِ وَمَا بَيْنَهُمَا الرَّحْمَٰنِ ۖ لَا يَمْلِكُونَ مِنْهُ خِطَابًا|يَوْمَ يَقُومُ الرُّوحُ وَالْمَلَائِكَةُ صَفًّا ۖ لَّا يَتَكَلَّمُونَ إِلَّا مَنْ أَذِنَ لَهُ الرَّحْمَٰنُ وَقَالَ صَوَابًا|ذَٰلِكَ الْيَوْمُ الْحَقُّ ۖ فَمَن شَاءَ اتَّخَذَ إِلَىٰ رَبِّهِ مَآبًا|إِنَّا أَنذَرْنَاكُمْ عَذَابًا قَرِيبًا يَوْمَ يَنظُرُ الْمَرْءُ مَا قَدَّمَتْ يَدَاهُ وَيَقُولُ الْكَافِرُ يَا لَيْتَنِي كُنتُ تُرَابًا"),T(79,"النازعات","An-Nazi'at","وَالنَّازِعَاتِ غَرْقًا|وَالنَّاشِطَاتِ نَشْطًا|وَالسَّابِحَاتِ سَبْحًا|فَالسَّابِقَاتِ سَبْقًا|فَالْمُدَبِّرَاتِ أَمْرًا|يَوْمَ تَرْجُفُ الرَّاجِفَةُ|تَتْبَعُهَا الرَّادِفَةُ|قُلُوبٌ يَوْمَئِذٍ وَاجِفَةٌ|أَبْصَارُهَا خَاشِعَةٌ|يَقُولُونَ أَإِنَّا لَمَرْدُودُونَ فِي الْحَافِرَةِ|أَإِذَا كُنَّا عِظَامًا نَّخِرَةً|قَالُوا تِلْكَ إِذًا كَرَّةٌ خَاسِرَةٌ|فَإِنَّمَا هِيَ زَجْرَةٌ وَاحِدَةٌ|فَإِذَا هُم بِالسَّاهِرَةِ|هَلْ أَتَاكَ حَدِيثُ مُوسَىٰ|إِذْ نَادَاهُ رَبُّهُ بِالْوَادِ الْمُقَدَّسِ طُوًى|اذْهَبْ إِلَىٰ فِرْعَوْنَ إِنَّهُ طَغَىٰ|فَقُلْ هَل لَّكَ إِلَىٰ أَن تَزَكَّىٰ|وَأَهْدِيَكَ إِلَىٰ رَبِّكَ فَتَخْشَىٰ|فَأَرَاهُ الْآيَةَ الْكُبْرَىٰ|فَكَذَّبَ وَعَصَىٰ|ثُمَّ أَدْبَرَ يَسْعَىٰ|فَحَشَرَ فَنَادَىٰ|فَقَالَ أَنَا رَبُّكُمُ الْأَعْلَىٰ|فَأَخَذَهُ اللَّهُ نَكَالَ الْآخِرَةِ وَالْأُولَىٰ|إِنَّ فِي ذَٰلِكَ لَعِبْرَةً لِّمَن يَخْشَىٰ|أَأَنتُمْ أَشَدُّ خَلْقًا أَمِ السَّمَاءُ ۚ بَنَاهَا|رَفَعَ سَمْكَهَا فَسَوَّاهَا|وَأَغْطَشَ لَيْلَهَا وَأَخْرَجَ ضُحَاهَا|وَالْأَرْضَ بَعْدَ ذَٰلِكَ دَحَاهَا|أَخْرَجَ مِنْهَا مَاءَهَا وَمَرْعَاهَا|وَالْجِبَالَ أَرْسَاهَا|مَتَاعًا لَّكُمْ وَلِأَنْعَامِكُمْ|فَإِذَا جَاءَتِ الطَّامَّةُ الْكُبْرَىٰ|يَوْمَ يَتَذَكَّرُ الْإِنسَانُ مَا سَعَىٰ|وَبُرِّزَتِ الْجَحِيمُ لِمَن يَرَىٰ|فَأَمَّا مَن طَغَىٰ|وَآثَرَ الْحَيَاةَ الدُّنْيَا|فَإِنَّ الْجَحِيمَ هِيَ الْمَأْوَىٰ|وَأَمَّا مَنْ خَافَ مَقَامَ رَبِّهِ وَنَهَى النَّفْسَ عَنِ الْهَوَىٰ|فَإِنَّ الْجَنَّةَ هِيَ الْمَأْوَىٰ|يَسْأَلُونَكَ عَنِ السَّاعَةِ أَيَّانَ مُرْسَاهَا|فِيمَ أَنتَ مِن ذِكْرَاهَا|إِلَىٰ رَبِّكَ مُنتَهَاهَا|إِنَّمَا أَنتَ مُنذِرُ مَن يَخْشَاهَا|كَأَنَّهُمْ يَوْمَ يَرَوْنَهَا لَمْ يَلْبَثُوا إِلَّا عَشِيَّةً أَوْ ضُحَاهَا"),T(80,"عبس","'Abasa","عَبَسَ وَتَوَلَّىٰ|أَن جَاءَهُ الْأَعْمَىٰ|وَمَا يُدْرِيكَ لَعَلَّهُ يَزَّكَّىٰ|أَوْ يَذَّكَّرُ فَتَنفَعَهُ الذِّكْرَىٰ|أَمَّا مَنِ اسْتَغْنَىٰ|فَأَنتَ لَهُ تَصَدَّىٰ|وَمَا عَلَيْكَ أَلَّا يَزَّكَّىٰ|وَأَمَّا مَن جَاءَكَ يَسْعَىٰ|وَهُوَ يَخْشَىٰ|فَأَنتَ عَنْهُ تَلَهَّىٰ|كَلَّا إِنَّهَا تَذْكِرَةٌ|فَمَن شَاءَ ذَكَرَهُ|فِي صُحُفٍ مُّكَرَّمَةٍ|مَّرْفُوعَةٍ مُّطَهَّرَةٍ|بِأَيْدِي سَفَرَةٍ|كِرَامٍ بَرَرَةٍ|قُتِلَ الْإِنسَانُ مَا أَكْفَرَهُ|مِنْ أَيِّ شَيْءٍ خَلَقَهُ|مِن نُّطْفَةٍ خَلَقَهُ فَقَدَّرَهُ|ثُمَّ السَّبِيلَ يَسَّرَهُ|ثُمَّ أَمَاتَهُ فَأَقْبَرَهُ|ثُمَّ إِذَا شَاءَ أَنشَرَهُ|كَلَّا لَمَّا يَقْضِ مَا أَمَرَهُ|فَلْيَنظُرِ الْإِنسَانُ إِلَىٰ طَعَامِهِ|أَنَّا صَبَبْنَا الْمَاءَ صَبًّا|ثُمَّ شَقَقْنَا الْأَرْضَ شَقًّا|فَأَنبَتْنَا فِيهَا حَبًّا|وَعِنَبًا وَقَضْبًا|وَزَيْتُونًا وَنَخْلًا|وَحَدَائِقَ غُلْبًا|وَفَاكِهَةً وَأَبًّا|مَّتَاعًا لَّكُمْ وَلِأَنْعَامِكُمْ|فَإِذَا جَاءَتِ الصَّاخَّةُ|يَوْمَ يَفِرُّ الْمَرْءُ مِنْ أَخِيهِ|وَأُمِّهِ وَأَبِيهِ|وَصَاحِبَتِهِ وَبَنِيهِ|لِكُلِّ امْرِئٍ مِّنْهُمْ يَوْمَئِذٍ شَأْنٌ يُغْنِيهِ|وُجُوهٌ يَوْمَئِذٍ مُّسْفِرَةٌ|ضَاحِكَةٌ مُّسْتَبْشِرَةٌ|وَوُجُوهٌ يَوْمَئِذٍ عَلَيْهَا غَبَرَةٌ|تَرْهَقُهَا قَتَرَةٌ|أُولَٰئِكَ هُمُ الْكَفَرَةُ الْفَجَرَةُ"),T(81,"التكوير","At-Takwir","إِذَا الشَّمْسُ كُوِّرَتْ|وَإِذَا النُّجُومُ انكَدَرَتْ|وَإِذَا الْجِبَالُ سُيِّرَتْ|وَإِذَا الْعِشَارُ عُطِّلَتْ|وَإِذَا الْوُحُوشُ حُشِرَتْ|وَإِذَا الْبِحَارُ سُجِّرَتْ|وَإِذَا النُّفُوسُ زُوِّجَتْ|وَإِذَا الْمَوْءُودَةُ سُئِلَتْ|بِأَيِّ ذَنبٍ قُتِلَتْ|وَإِذَا الصُّحُفُ نُشِرَتْ|وَإِذَا السَّمَاءُ كُشِطَتْ|وَإِذَا الْجَحِيمُ سُعِّرَتْ|وَإِذَا الْجَنَّةُ أُزْلِفَتْ|عَلِمَتْ نَفْسٌ مَّا أَحْضَرَتْ|فَلَا أُقْسِمُ بِالْخُنَّسِ|الْجَوَارِ الْكُنَّسِ|وَاللَّيْلِ إِذَا عَسْعَسَ|وَالصُّبْحِ إِذَا تَنَفَّسَ|إِنَّهُ لَقَوْلُ رَسُولٍ كَرِيمٍ|ذِي قُوَّةٍ عِندَ ذِي الْعَرْشِ مَكِينٍ|مُّطَاعٍ ثَمَّ أَمِينٍ|وَمَا صَاحِبُكُم بِمَجْنُونٍ|وَلَقَدْ رَآهُ بِالْأُفُقِ الْمُبِينِ|وَمَا هُوَ عَلَى الْغَيْبِ بِضَنِينٍ|وَمَا هُوَ بِقَوْلِ شَيْطَانٍ رَّجِيمٍ|فَأَيْنَ تَذْهَبُونَ|إِنْ هُوَ إِلَّا ذِكْرٌ لِّلْعَالَمِينَ|لِمَن شَاءَ مِنكُمْ أَن يَسْتَقِيمَ|وَمَا تَشَاءُونَ إِلَّا أَن يَشَاءَ اللَّهُ رَبُّ الْعَالَمِينَ"),T(82,"الانفطار","Al-Infitar","إِذَا السَّمَاءُ انفَطَرَتْ|وَإِذَا الْكَوَاكِبُ انتَثَرَتْ|وَإِذَا الْبِحَارُ فُجِّر لَاءِ لَضَالُّونَ|وَمَا أُرْسِلُوا عَلَيْهِمْ حَافِظِينَ|فَالْيَوْمَ الَّذِينَ آمَنُوا مِنَ الْكُفَّارِ يَضْحَكُونَ|عَلَى الْأَرَائِكِ يَنظُرُونَ|هَلْ ثُوِّبَ الْكُفَّارُ مَا كَانُوا يَفْعَلُونَ"),T(84,"الانشقاق","Al-Insyiqaq","إِذَا السَّمَاءُ انشَقَّتْ|وَأَذِنَتْ لِرَبِّهَا وَحُقَّتْ|وَإِذَا الْأَرْضُ مُدَّتْ|وَأَلْقَتْ مَا فِيهَا وَتَخَلَّتْ|وَأَذِنَتْ لِرَبِّهَا وَحُقَّتْ|يَا أَيُّهَا الْإِنسَانُ إِنَّكَ كَادِحٌ إِلَىٰ رَبِّكَ كَدْحًا فَمُلَاقِيهِ|فَأَمَّا مَنْ أُوتِيَ كِتَابَهُ بِيَمِينِهِ|فَسَوْفَ يُحَاسَبُ حِسَابًا يَسِيرًا|وَيَنقَلِبُ إِلَىٰ أَهْلِهِ مَسْرُورًا|وَأَمَّا مَنْ أُوتِيَ كِتَابَهُ وَرَاءَ ظَهْرِهِ|فَسَوْفَ يَدْعُو ثُبُورًا|وَيَصْلَىٰ سَعِيرًا|إِنَّهُ كَانَ فِي أَهْلِهِ مَسْرُورًا|إِنَّهُ ظَنَّ أَن لَّن يَحُورَ|بَلَىٰ إِنَّ رَبَّهُ كَانَ بِهِ بَصِيرًا|فَلَا أُقْسِمُ بِالشَّفَقِ|وَاللَّيْلِ وَمَا وَسَقَ|وَالْقَمَرِ إِذَا اتَّسَقَ|لَتَرْكَبُنَّ طَبَقًا عَن طَبَقٍ|فَمَا لَهُمْ لَا يُؤْمِنُونَ|وَإِذَا قُرِئَ عَلَيْهِمُ الْقُرْآنُ لَا يَسْجُدُونَ|بَلِ الَّذِينَ كَفَرُوا يُكَذِّبُونَ|وَاللَّهُ أَعْلَمُ بِمَا يُوعُونَ|فَبَشِّرْهُم بِعَذَابٍ أَلِيمٍ|إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ لَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍ"),T(85,"البروج","Al-Buruj","وَالسَّمَاءِ ذَاتِ الْبُرُوجِ|وَالْيَوْمِ الْمَوْعُودِ|وَشَاهِدٍ وَمَشْهُودٍ|قُتِلَ أَصْحَابُ الْأُخْدُودِ|النَّارِ ذَاتِ الْوَقُودِ|إِذْ هُمْ عَلَيْهَا قُعُودٌ|وَهُمْ عَلَىٰ مَا يَفْعَلُونَ بِالْمُؤْمِنِينَ شُهُودٌ|وَمَا نَقَمُوا مِنْهُمْ إِلَّا أَن يُؤْمِنُوا بِاللَّهِ الْعَزِيزِ الْحَمِيدِ|الَّذِي لَهُ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ ۚ وَاللَّهُ عَلَىٰ كُلِّ شَيْءٍ شَهِيدٌ|إِنَّ الَّذِينَ فَتَنُوا الْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ ثُمَّ لَمْ يَتُوبُوا فَلَهُمْ عَذَابُ جَهَنَّمَ وَلَهُمْ عَذَابُ الْحَرِيقِ|إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ لَهُمْ جَنَّاتٌ تَجْرِي مِن تَحْتِهَا الْأَنْهَارُ ۚ ذَٰلِكَ الْفَوْزُ الْكَبِيرُ|إِنَّ بَطْشَ رَبِّكَ لَشَدِيدٌ|إِنَّهُ هُوَ يُبْدِئُ وَيُعِيدُ|وَهُوَ الْغَفُورُ الْوَدُودُ|ذُو الْعَرْشِ الْمَجِيدُ|فَعَّالٌ لِّمَا يُرِيدُ|هَلْ أَتَاكَ حَدِيثُ الْجُنُو
