  <input type="file" id="csv-file-input" accept=".csv,.txt" style="display:none" /><input type="file" id="excel-file-input" accept=".xlsx,.xls,.csv" style="display:none" />
<div id="root"></div>
  
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script type="module">

// === V8.9.1 HARDCODED CLOUD URL ===
const HARDCODED_CLOUD_URL = "https://script.google.com/macros/s/AKfycbx19Zq4EwkbUwRwDc9-XNAV7y-Sl9zk3e3LE7ErXIitLu2Dsq7o7VOhbaKNx9a1dK9-/exec";
window.HARDCODED_CLOUD_URL = HARDCODED_CLOUD_URL;
// Auto-restore quizzes from cloud if local empty
(function autoRestoreQuizzes(){
  try{
    let localQuizzes = localStorage.getItem("smartcbt_quizzes_v8");
    let cloudUrl = localStorage.getItem("smartcbt_cloud_url") || HARDCODED_CLOUD_URL;
    if(!cloudUrl) return;
    // If local empty or less than 1 quiz, auto fetch from cloud
    let shouldRestore = !localQuizzes;
    if(localQuizzes){
      try{ let arr=JSON.parse(localQuizzes); if(arr.length===0) shouldRestore=true; }catch{ shouldRestore=true; }
    }
    if(shouldRestore){
      console.log("Auto-restore quizzes from cloud:", cloudUrl);
      fetch(`${cloudUrl}?action=getQuizzes`,{method:"GET"})
        .then(r=>r.json())
        .then(d=>{
          if(d && d.status==="ok" && d.quizzes && d.quizzes.length>0){
            localStorage.setItem("smartcbt_quizzes_v8", JSON.stringify(d.quizzes));
            console.log(`✅ Auto-restore ${d.quizzes.length} quizzes from cloud`);
            // Show notification if in UI
            setTimeout(()=>{
              if(document.body.innerText.includes("Bank Soal") || document.body.innerText.includes("Quiz")){
                // Don't auto reload, just notify
                console.log("Quizzes restored, please refresh Bank Soal");
              }
            }, 1000);
          }
        })
        .catch(e=>console.log("Auto-restore failed (offline?)", e));
    }
  }catch(e){ console.log("Auto-restore error", e); }
})();

// Ensure cloud_url is always set in localStorage if not set
try{
  if(!localStorage.getItem("smartcbt_cloud_url")){
    localStorage.setItem("smartcbt_cloud_url", HARDCODED_CLOUD_URL);

// --- CSV Import (no CDN) ---
window.csvImportSafe = (file)=>{
  if(!file) return;
  let reader=new FileReader();
  reader.onload=(e)=>{
    try{
      let text=e.target.result;
      let lines=text.split("\n").map(l=>l.trim()).filter(Boolean);
      if(lines.length<2){alert("CSV kosong");return;}
      let headers=lines[0].split(",").map(h=>h.trim().toLowerCase());
      let questions=[];
      for(let i=1;i<lines.length;i++){
        let parts=lines[i].split(",").map(p=>p.trim());
        if(parts.length<2) continue;
        let obj={};
        headers.forEach((h,idx)=>{obj[h]=parts[idx]||"";});
        let tipe=(obj.tipe||"pilihan_ganda").toLowerCase();
        let pertanyaan=obj.pertanyaan||"";
        if(!pertanyaan) continue;
        let q={id:Math.random().toString(36).slice(2), tipe:tipe, pertanyaan:pertanyaan, poin:parseInt(obj.poin||10,10)||10};
        if(obj.gambar) q.gambar=obj.gambar;
        if(obj.video) q.video=obj.video;
        if(["pilihan_ganda","benar_salah","poll","centang_banyak"].includes(tipe)){
          let opts=[];
          ["opsia","opsib","opsic","opsid","opsie","a","b","c","d"].forEach(k=>{if(obj[k]) opts.push({text:obj[k]});});
          if(opts.length<2) opts=[{text:"A"},{text:"B"}];
          q.options=opts;
          let jawaban=(obj.jawabanbenar||"0").trim();
          let num=parseInt(jawaban,10);
          if(!isNaN(num)) q.correctIndex=num>=1&&num<=opts.length?num-1:num;
          else q.correctIndex=0;
        } else if(tipe==="isian"){
          q.jawabanBenar=obj.jawabanbenar||"";
        } else if(tipe==="mengurutkan"){
          let urutan=(obj.jawabanbenar||"1,2,3,4").toString();
          q.correctOrder=urutan.split(",").map(s=>s.trim()).filter(Boolean);
        }
        questions.push(q);
      }
      if(questions.length===0){alert("Tidak ada soal valid");return;}
      saveImportedQuiz(questions, "CSV");
    }catch(err){alert("Gagal CSV: "+err.message);}
  };
  reader.readAsText(file);
};

// --- Excel Import (with SheetJS CDN) ---
window.excelImportSafe = (file)=>{
  if(!file) return;
  if(!window.XLSX){
    alert("Library Excel belum load, coba pakai CSV atau cek internet.\nJika CDN diblock sekolah, pakai CSV saja.");
    return;
  }
  let reader=new FileReader();
  reader.onload=(e)=>{
    try{
      let data=e.target.result;
      let wb=XLSX.read(data,{type:"array"});
      let ws=wb.Sheets[wb.SheetNames[0]];
      let rows=XLSX.utils.sheet_to_json(ws,{defval:""});
      if(rows.length===0){alert("Excel kosong");return;}
      let questions=[];
      rows.forEach((r)=>{
        let tipe=(r.Tipe||r.tipe||"pilihan_ganda").toString().trim().toLowerCase();
        if(["pg","pilgan"].includes(tipe)) tipe="pilihan_ganda";
        if(["bs","benar salah"].includes(tipe)) tipe="benar_salah";
        if(["cb","centang"].includes(tipe)) tipe="centang_banyak";
        if(["urut","mengurutkan"].includes(tipe)) tipe="mengurutkan";
        if(["kat","kategori"].includes(tipe)) tipe="kategori";
        if(["cocok","mencocokan"].includes(tipe)) tipe="mencocokan";
        if(["isian"].includes(tipe)) tipe="isian";
        let pertanyaan=(r.Pertanyaan||r.pertanyaan||r.Soal||"").toString();
        if(!pertanyaan) return;
        let q={id:Math.random().toString(36).slice(2), tipe:tipe, pertanyaan:pertanyaan, poin:parseInt(r.Poin||r.poin||10,10)||10};
        if(r.Gambar) q.gambar=r.Gambar.toString().trim();
        if(r.Video) q.video=r.Video.toString().trim();
        if(["pilihan_ganda","benar_salah","poll","centang_banyak"].includes(tipe)){
          let opts=[];
          ["OpsiA","OpsiB","OpsiC","OpsiD","OpsiE","A","B","C","D","E"].forEach(k=>{
            let v=(r[k]||"").toString().trim();
            if(v) opts.push({text:v});
          });
          if(opts.length===0 && r.Opsi){
            let parts=r.Opsi.toString().split(/[,;|]/).map(s=>s.trim()).filter(Boolean);
            opts=parts.map(t=>({text:t}));
          }
          if(opts.length<2) opts=[{text:"Opsi A"},{text:"Opsi B"}];
          q.options=opts;
          let jawaban=(r.JawabanBenar||r.Jawaban||"").toString().trim();
          if(tipe==="centang_banyak"){
            let idxs=[];
            jawaban.split(/[,;]/).forEach(j=>{
              j=j.trim();
              let num=parseInt(j,10);
              if(!isNaN(num)) idxs.push(num);
              else {
                let code=j.toUpperCase().charCodeAt(0)-65;
                if(code>=0&&code<opts.length) idxs.push(code);
              }
            });
            q.correctIndexes=idxs.length?idxs:[0];
          } else if(tipe!=="poll"){
            let correctIndex=0;
            let num=parseInt(jawaban,10);
            if(!isNaN(num)){
              if(num>=0&&num<opts.length) correctIndex=num;
              else if(num>=1&&num<=opts.length) correctIndex=num-1;
            } else if(jawaban.length===1){
              let code=jawaban.toUpperCase().charCodeAt(0)-65;
              if(code>=0&&code<opts.length) correctIndex=code;
            } else if(jawaban){
              let found=opts.findIndex(o=>o.text.toLowerCase()===jawaban.toLowerCase());
              if(found>=0) correctIndex=found;
            }
            q.correctIndex=correctIndex;
          }
        } else if(tipe==="mengurutkan"){
          let urutan=(r.JawabanBenar||r.Jawaban||"1,2,3,4").toString();
          let correctOrder=urutan.split(/[,;|]/).map(s=>s.trim()).filter(Boolean);
          q.correctOrder=correctOrder.length?correctOrder:["1","2","3","4"];
        } else if(tipe==="kategori"){
          let kategoriList=(r.KategoriList||"A,B").toString().split(/[,;]/).map(s=>s.trim()).filter(Boolean);
          if(kategoriList.length<2) kategoriList=["A","B"];
          q.kategoriList=kategoriList;
          let itemsStr=(r.Items||r.JawabanBenar||"").toString();
          let items=[];
          if(itemsStr.includes(":")){
            itemsStr.split(/[,;]/).forEach(pair=>{
              let parts=pair.split(":").map(s=>s.trim());
              if(parts[0]&&parts[1]) items.push({text:parts[0], kategori:parts[1]});
            });
          }
          q.kategoriItems=items.length?items:[{text:"Item1", kategori:kategoriList[0]}, {text:"Item2", kategori:kategoriList[1]}];
        } else if(tipe==="mencocokan"){
          let pasanganStr=(r.JawabanBenar||"").toString();
          let pasangKiri=[], pasangKanan=[], pasanganBenar=[];
          if(pasanganStr.includes(":")){
            pasanganStr.split(/[,;]/).forEach(pair=>{
              let parts=pair.split(":").map(s=>s.trim());
              if(parts[0]&&parts[1]){
                pasangKiri.push(parts[0]);
                pasangKanan.push(parts[1]);
                pasanganBenar.push({kiri:parts[0], kanan:parts[1]});
              }
            });
          }
          q.pasangKiri=pasangKiri;
          q.pasangKanan=pasangKanan;
          q.pasanganBenar=pasanganBenar;
        } else if(tipe==="isian"){
          q.jawabanBenar=(r.JawabanBenar||"").toString().trim();
        }
        questions.push(q);
      });
      if(questions.length===0){alert("Tidak ada soal valid di Excel");return;}
      saveImportedQuiz(questions, "Excel");
    }catch(err){alert("Gagal Excel: "+err.message);}
  };
  reader.readAsArrayBuffer(file);
};

window.saveImportedQuiz = (questions, source)=>{
  try{
    let stored=localStorage.getItem("smartcbt_quizzes_v8");
    let quizzes=stored?JSON.parse(stored):[];
    let newQuiz={
      id:"qz-"+Date.now(),
      judul:`Quiz ${source} ${new Date().toLocaleDateString("id-ID")} - ${questions.length} soal`,
      mapel:"Umum",
      kelas:["1","2","3","4","5","6"],
      deskripsi:`Import ${source} ${questions.length} soal - ${new Date().toLocaleString("id-ID")}`,
      coverEmoji: source==="Excel" ? "📊" : "📥",
      shuffleQuestions:true,
      shuffleOptions:true,
      createdAt:new Date().toISOString(),
      questions:questions
    };
    quizzes=[newQuiz, ...quizzes];
    localStorage.setItem("smartcbt_quizzes_v8", JSON.stringify(quizzes));
    
    // Simpan user saat ini biar setelah reload auto-login lagi (tidak keluar login)
    try{
      let currentUser=localStorage.getItem("smartcbt_current_user_name")||"";
      let currentRole=localStorage.getItem("smartcbt_current_user_role")||"guru";
      if(currentUser){
        localStorage.setItem("smartcbt_after_import", "1");
        localStorage.setItem("smartcbt_after_import_user", currentUser);
        localStorage.setItem("smartcbt_after_import_role", currentRole);
        localStorage.setItem("smartcbt_after_import_quiz", newQuiz.judul);
      }
    }catch{}
    
    alert(`✅ Import ${source} berhasil! ${questions.length} soal jadi Quiz "${newQuiz.judul}".\n\nHalaman akan reload otomatis dan login lagi sebagai guru.`);
    try{
      let cloudUrl=localStorage.getItem("smartcbt_cloud_url")||"https://script.google.com/macros/s/AKfycbx19Zq4EwkbUwRwDc9-XNAV7y-Sl9zk3e3LE7ErXIitLu2Dsq7o7VOhbaKNx9a1dK9-/exec";
      if(cloudUrl){
        fetch(cloudUrl,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"saveQuiz", quiz:newQuiz})}).catch(()=>{});
      }
    }catch{}
    setTimeout(()=>{location.reload();}, 800);
  }catch(err){
    alert("Gagal simpan: "+err.message);
  }
};

// Auto-login setelah import reload
(function(){
  let afterImport=localStorage.getItem("smartcbt_after_import");
  let afterUser=localStorage.getItem("smartcbt_after_import_user");
  let afterRole=localStorage.getItem("smartcbt_after_import_role");
  let afterQuiz=localStorage.getItem("smartcbt_after_import_quiz");
  if(afterImport==="1" && afterUser){

    // Clear flag after 10 seconds to avoid loop
    setTimeout(()=>{localStorage.removeItem("smartcbt_after_import");}, 10000);
    
    // Tunggu halaman login muncul, lalu auto pilih user dan klik Masuk
    let attempts=0;
    let autoLoginInterval=setInterval(()=>{
      attempts++;
      if(attempts>30){clearInterval(autoLoginInterval); localStorage.removeItem("smartcbt_after_import"); return;}
      
      // Cari input nama atau dropdown yang berisi afterUser
      let allButtons=[...document.querySelectorAll("button")];
      let masukBtn=allButtons.find(b=>b.textContent.trim()==="Masuk" && b.offsetParent!==null);
      
      // Cari elemen yang berisi nama user (di dropdown siswa/guru)

        return el.textContent.trim()===afterUser && el.offsetParent!==null;

      if(nameElements.length>0){

          nameInput.dispatchEvent(new Event('change', {bubbles:true}));
          setTimeout(()=>{if(masukBtn) masukBtn.click();}, 300);
        }
      }
    }, 800);
  }
})();

// === Anti-Farming Quiz Safe ===
setInterval(()=>{
  try{
    let currentUser=localStorage.getItem("smartcbt_current_user_name");
    if(!currentUser) return;
    let normCurrent=currentUser.toLowerCase().trim();
    let stored=localStorage.getItem("smartcbt_attempts_v8");
    if(!stored) return;
    let attempts=JSON.parse(stored);
    let attemptedQuizIds=new Set(attempts.filter(a=>a.studentName&&a.studentName.toLowerCase().trim()===normCurrent).map(a=>a.quizId));
    let buttons=[...document.querySelectorAll("button")].filter(b=>b.textContent.includes("Mulai")||b.textContent.includes("Kerjakan"));
    buttons.forEach(btn=>{
      let card=btn.closest("div");
      if(!card) return;
      let quizzesStr=localStorage.getItem("smartcbt_quizzes_v8");
      if(!quizzesStr) return;
      let quizzes=JSON.parse(quizzesStr);
      // Try to match quiz by title in card
      let cardText=card.innerText||"";
      let matched=quizzes.find(q=>cardText.includes(q.judul.substring(0,15)));
      if(matched && attemptedQuizIds.has(matched.id)){
        if(!btn.disabled){
          btn.disabled=true;
          btn.textContent="Sudah Dikerjakan ⛔";
          btn.style.background="#e4e4e7";
          btn.style.color="#71717a";
          btn.style.cursor="not-allowed";
        }
      }
    });
  }catch{}
}, 1500);

// === V8.9 Download Rekap Excel - Safe Injection ===

window.downloadRekapExcel = ()=>{
  try{
    if(!window.XLSX){
      alert("Library Excel belum load, coba pakai Download CSV dulu.\nJika CDN diblock, pakai CSV.");
      window.downloadRekapCsv();
      return;
    }
    let attemptsStr=localStorage.getItem("smartcbt_attempts_v8");
    let quizzesStr=localStorage.getItem("smartcbt_quizzes_v8");
    let attempts=attemptsStr?JSON.parse(attemptsStr):[];
    let quizzes=quizzesStr?JSON.parse(quizzesStr):[];
    
    if(attempts.length===0){
      alert("Belum ada data attempt untuk di-download.\nSiswa belum ada yang mengerjakan quiz.");
      return;
    }
    
    // Buat map quizId -> quiz
    let quizMap={};
    quizzes.forEach(q=>{quizMap[q.id]=q;});
    
    // Sheet 1: Detail per pengerjaan
    let detailData=[
      ["No","Nama Siswa","Kelas","NISN","Judul Quiz","Mapel","Skor","Total Soal","Benar","Persentase","Tanggal","Waktu","Durasi (detik)","XP Didapat"]
    ];
    
    attempts.forEach((a, idx)=>{
      let quiz=quizMap[a.quizId]||{};
      let totalSoal=quiz.questions?quiz.questions.length:(a.totalQuestions||a.answers?.length||0);
      let benar=a.score||0;
      let persentase=totalSoal?Math.round((benar/totalSoal)*100):0;
      let tanggal=a.completedAt||a.createdAt||"";
      let waktu=tanggal?new Date(tanggal).toLocaleString("id-ID"):"";
      let durasi=a.duration||a.timeSpent||"";
      let xp=a.xpEarned||a.xp||0;
      
      detailData.push([
        idx+1,
        a.studentName||a.nama||"",
        a.studentClass||a.kelas||"",
        a.nisn||a.studentNisn||"",
        a.quizTitle||quiz.judul||"",
        quiz.mapel||a.mapel||"Umum",
        benar,
        totalSoal,
        benar,
        persentase+"%",
        tanggal.split("T")[0]||"",
        waktu,
        durasi,
        xp
      ]);
    });
    
    // Sheet 2: Rekap per siswa
    let siswaMap={};
    attempts.forEach(a=>{
      let key=(a.studentName||"").toLowerCase().trim()+"|"+(a.studentClass||"");
      if(!siswaMap[key]){
        siswaMap[key]={
          nama:a.studentName||"",
          kelas:a.studentClass||a.kelas||"",
          nisn:a.nisn||a.studentNisn||"",
          totalQuiz:0,
          totalBenar:0,
          totalSoal:0,
          totalXp:0,
          rataPersentase:0,
          attemptList:[]
        };
      }
      let quiz=quizMap[a.quizId]||{};
      let totalSoal=quiz.questions?quiz.questions.length:(a.totalQuestions||0);
      let benar=a.score||0;
      siswaMap[key].totalQuiz++;
      siswaMap[key].totalBenar+=benar;
      siswaMap[key].totalSoal+=totalSoal;
      siswaMap[key].totalXp+=(a.xpEarned||0);
      siswaMap[key].attemptList.push(a);
    });
    
    let rekapData=[
      ["No","Nama Siswa","Kelas","NISN","Jumlah Quiz Dikerjakan","Total Soal Dikerjakan","Total Benar","Rata-rata %","Total XP","Level","Terakhir Mengerjakan"]
    ];
    
    let idx=1;
    Object.values(siswaMap).forEach(s=>{
      let avg=s.totalSoal?Math.round((s.totalBenar/s.totalSoal)*100):0;
      // Hitung level dari XP (simplified: level = floor(XP/100)+1)
      let level=Math.floor(s.totalXp/100)+1;
      let lastAttempt=s.attemptList.sort((a,b)=>new Date(b.completedAt||b.createdAt)-new Date(a.completedAt||a.createdAt))[0];
      let lastDate=lastAttempt?new Date(lastAttempt.completedAt||lastAttempt.createdAt).toLocaleDateString("id-ID"):"";
      
      rekapData.push([
        idx++,
        s.nama,
        s.kelas,
        s.nisn,
        s.totalQuiz,
        s.totalSoal,
        s.totalBenar,
        avg+"%",
        s.totalXp,
        level,
        lastDate
      ]);
    });
    
    // Sheet 3: Rekap per Quiz
    let quizRekapMap={};
    attempts.forEach(a=>{
      let qId=a.quizId;
      if(!quizRekapMap[qId]){
        let quiz=quizMap[qId]||{};
        quizRekapMap[qId]={
          judul:quiz.judul||a.quizTitle||"",
          mapel:quiz.mapel||"Umum",
          kelas:quiz.kelas?quiz.kelas.join(","):"",
          totalPengerjaan:0,
          totalBenar:0,
          totalSoal:0,
          rataNilai:0,
          siswaList:new Set()
        };
      }
      quizRekapMap[qId].totalPengerjaan++;
      quizRekapMap[qId].totalBenar+=(a.score||0);
      let quiz=quizMap[qId]||{};
      let totalSoal=quiz.questions?quiz.questions.length:(a.totalQuestions||0);
      quizRekapMap[qId].totalSoal+=totalSoal;
      quizRekapMap[qId].siswaList.add((a.studentName||"").toLowerCase().trim());
    });
    
    let quizRekapData=[
      ["No","Judul Quiz","Mapel","Kelas","Jumlah Pengerjaan","Jumlah Siswa Unik","Rata-rata Benar","Rata-rata %"]
    ];
    
    let qIdx=1;
    Object.values(quizRekapMap).forEach(q=>{
      let avgBenar=q.totalPengerjaan? (q.totalBenar/q.totalPengerjaan).toFixed(1):0;
      let avgSoal=q.totalPengerjaan? (q.totalSoal/q.totalPengerjaan):0;
      let avgPersen=avgSoal?Math.round((avgBenar/avgSoal)*100):0;
      quizRekapData.push([
        qIdx++,
        q.judul,
        q.mapel,
        q.kelas,
        q.totalPengerjaan,
        q.siswaList.size,
        avgBenar,
        avgPersen+"%"
      ]);
    });
    
    // Buat workbook
    let wb=XLSX.utils.book_new();
    let wsDetail=XLSX.utils.aoa_to_sheet(detailData);
    let wsRekap=XLSX.utils.aoa_to_sheet(rekapData);
    let wsQuiz=XLSX.utils.aoa_to_sheet(quizRekapData);
    
    // Auto width
    [wsDetail, wsRekap, wsQuiz].forEach(ws=>{
      let cols=[];
      let data=wsDetail===ws?detailData:wsRekap===ws?rekapData:quizRekapData;
      if(data.length>0){
        for(let i=0;i<data[0].length;i++){
          let maxLen=10;
          data.forEach(row=>{
            let cell=row[i];
            if(cell){
              let len=cell.toString().length;
              if(len>maxLen) maxLen=len;
            }
          });
          cols.push({wch: Math.min(maxLen+2, 30)});
        }
        ws["!cols"]=cols;
      }
    });
    
    XLSX.utils.book_append_sheet(wb, wsDetail, "Detail Pengerjaan");
    XLSX.utils.book_append_sheet(wb, wsRekap, "Rekap Per Siswa");
    XLSX.utils.book_append_sheet(wb, wsQuiz, "Rekap Per Quiz");
    
    // Tambah sheet info
    let infoData=[
      ["SD Global Mandiri - Rekap Nilai SmartCBT"],
      ["Tanggal Export", new Date().toLocaleString("id-ID")],
      ["Total Pengerjaan", attempts.length],
      ["Total Siswa", Object.keys(siswaMap).length],
      ["Total Quiz", quizzes.length],
      [],
      ["Dibuat oleh", "SmartCBT V8.9"],
      ["Catatan", "Data diambil dari localStorage + Cloud"]
    ];
    let wsInfo=XLSX.utils.aoa_to_sheet(infoData);
    XLSX.utils.book_append_sheet(wb, wsInfo, "Info");
    
    let fileName=`Rekap-Nilai-SD-Global-Mandiri-${new Date().toISOString().split('T')[0]}.xlsx`;
    XLSX.writeFile(wb, fileName);
    
    alert(`✅ Rekap Excel berhasil didownload!\n\nFile: ${fileName}\n\nIsi:\n- ${detailData.length-1} baris detail pengerjaan\n- ${rekapData.length-1} siswa\n- ${quizRekapData.length-1} quiz\n\nBuka file untuk lihat rekap lengkap.`);
    
  }catch(err){
    alert("Gagal download Excel: "+err.message+"\nCoba pakai Download CSV.");
    console.error(err);
  }
};

window.downloadRekapCsv = ()=>{
  try{
    let attemptsStr=localStorage.getItem("smartcbt_attempts_v8");
    let attempts=attemptsStr?JSON.parse(attemptsStr):[];
    if(attempts.length===0){
      alert("Belum ada data untuk di-download.");
      return;
    }
    let csv="No,Nama,Kelas,NISN,Quiz,Mapel,Skor,Total Soal,Persentase,Tanggal,XP\n";
    attempts.forEach((a, idx)=>{
      let total=a.totalQuestions||a.answers?.length||0;
      let benar=a.score||0;
      let persen=total?Math.round((benar/total)*100):0;
      let tanggal=(a.completedAt||a.createdAt||"").split("T")[0]||"";
      csv+=`${idx+1},"${(a.studentName||"").replace(/"/g,'""')}","${(a.studentClass||a.kelas||"").replace(/"/g,'""')}","${(a.nisn||"").replace(/"/g,'""')}","${(a.quizTitle||"").replace(/"/g,'""')}","${(a.mapel||"").replace(/"/g,'""')}",${benar},${total},${persen}%,${tanggal},${a.xpEarned||0}\n`;
    });
    let blob=new Blob([csv],{type:"text/csv"});
    let url=URL.createObjectURL(blob);
    let a=document.createElement("a");
    a.href=url;
    a.download=`Rekap-Nilai-${new Date().toISOString().split('T')[0]}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    alert(`✅ CSV berhasil didownload: ${attempts.length} baris`);
  }catch(err){
    alert("Gagal CSV: "+err.message);
  }
};

// === V8.9.2 Tarik Attempts dari Cloud untuk Guru ===
window.tarikAttemptsDariCloud = async ()=>{
  try{
    let cloudUrl = localStorage.getItem("smartcbt_cloud_url") || window.HARDCODED_CLOUD_URL || "";
    if(!cloudUrl){
      alert("⚠️ URL Cloud belum diisi. Set di Tab Cloud dulu.");
      return;
    }
    let btn = document.getElementById("btn-tarik-attempts");
    if(btn){ btn.textContent="⏳ Menarik..."; btn.disabled=true; }
    
    let response = await fetch(`${cloudUrl}?action=getAllAttempts`, {method:"GET"});
    let data = await response.json();
    
    if(data && data.status==="ok" && data.attempts){
      let cloudAttempts = data.attempts;
      let localStr = localStorage.getItem("smartcbt_attempts_v8");
      let localAttempts = localStr ? JSON.parse(localStr) : [];
      
      // Merge: gabung cloud + local, hindari duplikat berdasarkan attemptId atau kombinasi nama+quizId+date
      let existingKeys = new Set(localAttempts.map(a => `${(a.studentName||"").toLowerCase().trim()}|${a.quizId}|${a.completedAt||a.date||a.timestamp}`));
      let newCount = 0;
      cloudAttempts.forEach(ca=>{
        let key = `${(ca.studentName||"").toLowerCase().trim()}|${ca.quizId}|${ca.completedAt||ca.date||ca.timestamp}`;
        // Also check by attemptId
        let existsById = localAttempts.some(la => la.id && ca.id && la.id===ca.id);
        if(!existingKeys.has(key) && !existsById){
          localAttempts.push(ca);
          existingKeys.add(key);
          newCount++;
        }
      });
      
      localStorage.setItem("smartcbt_attempts_v8", JSON.stringify(localAttempts));
      
      alert(`✅ Tarik Attempts berhasil!\n\nDari Cloud: ${cloudAttempts.length} attempt\nBaru ditambahkan: ${newCount}\nTotal di HP sekarang: ${localAttempts.length}\n\nSekarang klik Download Excel lagi untuk rekap terbaru.`);
      
      // Auto trigger download rekap after tarik?
      if(newCount>0 && confirm("Mau langsung Download Excel rekap terbaru?")){
        window.downloadRekapExcel();
      }
    } else {
      alert("Gagal tarik attempts: "+(data.message||"unknown"));
    }
  }catch(err){
    alert("Gagal tarik attempts: "+err.message+"\nCek internet & URL Cloud.");

  } finally {
    let btn = document.getElementById("btn-tarik-attempts");
    if(btn){ btn.textContent="☁️ Tarik Attempts dari Cloud"; btn.disabled=false; }
  }
};

// === V8.9.3 Lock/Unlock Quiz Feature ===
window.lockAllQuizzes = ()=>{
  try{
    let quizzesStr=localStorage.getItem("smartcbt_quizzes_v8");
    if(!quizzesStr){alert("Tidak ada quiz"); return;}
    let quizzes=JSON.parse(quizzesStr);
    let lockedCount=quizzes.filter(q=>q.locked).length;
    let shouldLock = lockedCount < quizzes.length/2; // if mostly unlocked, lock all, else unlock all
    let action = shouldLock ? "Kunci" : "Buka";
    if(!confirm(`${action} SEMUA quiz?\n\n${action} ${quizzes.length} quiz untuk siswa?`)) return;
    quizzes=quizzes.map(q=>({...q, locked: shouldLock}));
    localStorage.setItem("smartcbt_quizzes_v8", JSON.stringify(quizzes));
    // Sync to cloud
    let cloudUrl=localStorage.getItem("smartcbt_cloud_url")||window.HARDCODED_CLOUD_URL||"";
    if(cloudUrl){
      quizzes.forEach(q=>{
        fetch(cloudUrl,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"saveQuiz",quiz:q})}).catch(()=>{});
      });
    }
    alert(`✅ ${quizzes.length} quiz berhasil di-${shouldLock?"kunci 🔒":"buka 🔓"}!\n\nRefresh halaman untuk lihat perubahan.`);
    setTimeout(()=>{location.reload();}, 800);
  }catch(e){alert("Gagal: "+e.message);}
};
